metadata:
  atespace: ate-demo-pi
  name: pi-durable-data
workerSelector:
  matchLabels:
    workload: pi-durable
containers:
- name: pi-durable
  image: us-central1-docker.pkg.dev/daniel-junk/ate-ish/pi-durable:latest  # ignored: actors run from the node image
  command:
  - node
  - /actor/server-gateway.ts
  env:
  - name: PORT
    value: "8080"
  - name: AI_GATEWAY_API_KEY
    value: ate-placeholder-key
  - name: NODE_EXTRA_CA_CERTS
    value: /run/ate/trust-bundle.pem
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
    timeoutSeconds: 30
  volumeMounts:
  - name: workspace
    mountPath: /workspace
  - name: system-info
    mountPath: /run/ate
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_DATA
  onCommit: SNAPSHOT_CONTENT_SCOPE_DATA
  # Uses the bundled rustfs bucket on kind; on GKE, set to gs://<your-gcs-bucket>/...
  storageLocation: gs://ate-snapshots/ate-demo-pi-data/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
volumes:
- name: workspace
  durableDir: {}
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        path: trust-bundle.pem
