metadata:
  atespace: ate-demo-pi
  name: pi-durable-data
workerSelector:
  matchLabels:
    workload: pi-durable
containers:
- name: pi-durable
  image: us-central1-docker.pkg.dev/daniel-junk/cloud-run-source-deploy/ate-lite-pi-durable-actor@sha256:b2b6ba2a2ba3c2a67c9fa36f8b063a02e7c40ec33b080cda27a3b858d5fe2818
  command:
  - node
  - /app/server.ts
  env:
  - name: PORT
    value: "8080"
  - name: GEMINI_API_KEY
    value: ate-placeholder-key
  - name: NODE_EXTRA_CA_CERTS
    value: /run/ate/trust-bundle.pem
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
    timeoutSeconds: 30
  volumeMounts:
  - name: workspace
    mountPath: /workspace
  - name: system-info
    mountPath: /run/ate
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
  storageLocation: gs://ate-node-daniel-junk/
volumes:
- name: workspace
  durableDir: {}
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        path: trust-bundle.pem
